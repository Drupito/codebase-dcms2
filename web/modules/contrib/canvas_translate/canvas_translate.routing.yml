canvas_translate.api.translation.discard:
  path: '/canvas-translate/api/items/canvas_page/{canvas_page}/{langcode}'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::discardDraft'
  requirements:
    _permission: 'translate canvas content'
    _csrf_request_header_token: 'TRUE'
    canvas_page: \d+
