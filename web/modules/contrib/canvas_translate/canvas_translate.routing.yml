canvas_translate.api.items:
  path: '/canvas-translate/api/items'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::items'
  requirements:
    _permission: 'translate canvas content'
  methods: [GET]
  options:
    no_cache: TRUE

canvas_translate.api.editor_assets:
  path: '/canvas-translate/api/editor-assets'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\EditorAssetsController::get'
  requirements:
    _permission: 'translate canvas content'
  methods: [GET]
  options:
    # Resolve assets against the admin theme, as Canvas's own forms do.
    _admin_route: TRUE
    no_cache: TRUE

canvas_translate.api.translation.get:
  path: '/canvas-translate/api/items/canvas_page/{canvas_page}/{langcode}'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::getTranslation'
  requirements:
    _permission: 'translate canvas content'
    canvas_page: \d+
  methods: [GET]
  options:
    parameters:
      canvas_page:
        type: 'entity:canvas_page'
    no_cache: TRUE

canvas_translate.api.translation.save:
  path: '/canvas-translate/api/items/canvas_page/{canvas_page}/{langcode}'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::saveDraft'
  requirements:
    _permission: 'translate canvas content'
    _csrf_request_header_token: 'TRUE'
    canvas_page: \d+
  methods: [PATCH]
  options:
    parameters:
      canvas_page:
        type: 'entity:canvas_page'
    no_cache: TRUE

canvas_translate.api.translation.publish:
  path: '/canvas-translate/api/items/canvas_page/{canvas_page}/{langcode}/publish'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::publish'
  requirements:
    _permission: 'translate canvas content'
    _csrf_request_header_token: 'TRUE'
    canvas_page: \d+
  methods: [POST]
  options:
    parameters:
      canvas_page:
        type: 'entity:canvas_page'
    no_cache: TRUE

canvas_translate.api.translation.mark_reviewed:
  path: '/canvas-translate/api/items/canvas_page/{canvas_page}/{langcode}/mark-reviewed'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::markReviewed'
  requirements:
    _permission: 'translate canvas content'
    _csrf_request_header_token: 'TRUE'
    canvas_page: \d+
  methods: [POST]
  options:
    parameters:
      canvas_page:
        type: 'entity:canvas_page'
    no_cache: TRUE

canvas_translate.api.translation.approve:
  path: '/canvas-translate/api/items/canvas_page/{canvas_page}/{langcode}/approve'
  defaults:
    _controller: '\Drupal\canvas_translate\Controller\ApiTranslateController::approve'
  requirements:
    _permission: 'translate canvas content'
    _csrf_request_header_token: 'TRUE'
    canvas_page: \d+
  methods: [POST]
  options:
