$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Logo card
description: A component with an image and optional background and link.
group: Card
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Logo
      examples:
        - src: "assets/forma.png"
          alt: "Forma logo"
          width: 342
          height: 69
    url:
      type: string
      title: Link
      format: uri-reference
