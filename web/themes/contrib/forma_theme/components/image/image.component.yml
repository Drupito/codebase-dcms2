$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Image
group: Base
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/arturo-castaneyra-xLyOGT8i1qA-unsplash.jpg"
          alt: "Underground staircase with dark lighting showing a glimpse of outside."
          width: 2000
          height: 1500
    size:
      title: Aspect ratio
      type: string
      enum:
        - "4:1"
        - "3:1"
        - "2:1"
        - "16:9"
        - "3:2"
        - "4:3"
        - "1:1"
        - "3:4"
        - "2:3"
      meta:enum:
        "4:1": "4×1"
        "3:1": "3×1"
        "2:1": "2×1"
        "16:9": "16×9"
        "3:2": "3×2"
        "4:3": "4×3"
        "1:1": Square
        "3:4": 3x4
        "2:3": 2x3
      default: "4:3"
      examples:
        - "4:3"
    caption:
      title: Caption
      type: string
    url:
      type: string
      title: Link
      format: uri-reference
