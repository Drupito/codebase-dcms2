$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Service Card
group: Cards
status: stable
description: 'A service/insight card with an image, heading, description, and an "Explore" pill CTA. Title and button turn orange on hover/active.'
props:
  type: object
  properties:
    media:
      $ref: 'json-schema-definitions://canvas.module/image'
      title: 'Card Image'
    heading:
      type: string
      title: 'Heading'
      examples:
        - 'Digital Transformation'
    description:
      type: string
      title: 'Description'
      examples:
        - 'We help organizations navigate complex digital transformations with confidence.'
    cta_text:
      type: string
      title: 'CTA Label'
      default: 'Explore'
    cta_url:
      type: string
      title: 'CTA URL'
      examples:
        - '/services/digital-transformation'
    extra_classes:
      type: string
      title: 'Extra Classes'
