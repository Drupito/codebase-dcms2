$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Benefits Slider
group: Organisms
status: stable
description: 'Horizontal scroll slider for benefit cards — H3 heading + scrollable row of icon/text cards. Used for "Why [Brand]?" sections.'
props:
  type: object
  properties:
    heading:
      type: string
      title: 'Section Heading'
      examples:
        - 'Why Hourglass?'
    extra_classes:
      type: string
      title: 'Extra Classes'
slots:
  cards:
    title: 'Benefit Cards'
    description: 'Place Benefit Card components here — each becomes a slide.'
