$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Contact CTA
group: Organisms
status: stable
description: 'Two-column CTA section: orange left card with body text and button, white right card with a contact form slot.'
props:
  type: object
  properties:
    section_title:
      type: string
      title: 'Section Title'
      contentMediaType: text/html
      examples:
        - 'Your Needs, Our Expertise'
    cta_body:
      type: string
      title: 'CTA Body Text'
      contentMediaType: text/html
      examples:
        - 'Let us know what you need and we will get back to you shortly.'
    cta_button_label:
      type: string
      title: 'CTA Button Label'
      examples:
        - 'Get in Touch'
    cta_button_url:
      type: string
      title: 'CTA Button URL'
      examples:
        - '#contact'
slots:
  form:
    title: 'Contact Form'
    description: 'Place a Webform or custom form block here.'
