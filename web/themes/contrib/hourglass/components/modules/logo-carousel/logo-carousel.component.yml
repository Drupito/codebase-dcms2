$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Logo Carousel
group: Organisms
status: stable
description: 'Infinite-scroll logo marquee powered by Splide AutoScroll. Place Logo Item atoms in the logos slot.'
props:
  type: object
  properties:
    section_title:
      type: string
      title: 'Section Title'
      contentMediaType: text/html
      examples:
        - 'Trusted by Industry Leaders'
slots:
  logos:
    title: 'Logo Items'
    description: 'Place Logo Item atoms here.'
