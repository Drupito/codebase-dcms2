$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Video Feature
group: Organisms
status: stable
description: 'Video section — side (text left + video right) or stacked (header above + full-width video below).'
props:
  type: object
  properties:
    play_button_text:
      type: string
      title: 'Watch Video Text'
    extra_classes:
      type: string
      title: 'Extra Classes'
slots:
  heading:
    title: 'Heading'
    description: 'Place the Heading atom here.'
  description:
    title: 'Description'
