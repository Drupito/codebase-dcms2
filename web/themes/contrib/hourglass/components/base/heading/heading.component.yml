$schema: "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Heading
group: Atoms
status: stable
description: 'Standard heading component'
props:
  type: object
  properties:
    level:
      type: integer
      title: 'Heading Level'
      enum: [1, 2, 3, 4, 5, 6]
      default: 2
    size:
      type: string
      title: 'Heading Size'
      enum: [h1, h2, h3, h4, h5, h6, display, lead]
      default: h2
    heading_text:
      type: string
      title: 'Heading Text'
      contentMediaType: text/html
    extra_classes:
      type: string
      title: 'Extra Classes'
slots:
  content:
    title: 'Heading Content'
