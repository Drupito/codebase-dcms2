"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Text card
group: Card
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
      examples:
        - "This is your card title"
    icon:
      type: string
      title: Icon name
      description: 'The ID of an icon from the <a href="https://phosphoricons.com/" target="_blank">Phosphor Icons</a> library.'
      default: "arrow-right"
      examples:
        - "arrow-right"
    url:
      type: string
      title: URL
      format: uri-reference
    text:
      type: string
      title: Description
      pattern: "(.|\\r?\\n)*"
      examples:
        - "Quaerat laborum rerum dolores dolores dolor qui."
