$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Image
group: Base
props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      type: object
      examples:
        - src: "assets/george-pagan-iii-FBwW4Xu3FTs-unsplash.jpg"
          alt: "Black-and-white striped wallpaper"
          width: 1920
          height: 1415
    size:
      title: Aspect ratio
      type: string
      enum:
        - "2:1"
        - 16:9
        - 3:2
        - 4:3
        - 1:1
        - 3:4
        - 2:3
      meta:enum:
        2:1: "2×1"
        16:9: "16×9"
        3:2: "3×2"
        4:3: "4×3"
        1:1: Square
        3:4: 3x4
        2:3: 2x3
      default: "4:3"
      examples:
        - "4:3"
    caption:
      title: Caption
      type: string
    url:
      type: string
      title: Link
      format: uri-reference
