      component_id: sdc.goodwell_theme.accordion
      inputs:
        answer: 'Life insurance helps provide financial security for your loved ones by covering living expenses, debts, and future financial needs if something unexpected happens to you'
        question: 'Why do I need life insurance?'
        default_state: collapsed
    -
