      component_id: sdc.goodwell_theme.accordion
      inputs:
        answer: 'The amount of coverage you need depends on your income, financial obligations, debts, and future family expenses. A good policy should provide enough support to help your loved ones maintain their lifestyle and achieve their long-term goals.'
