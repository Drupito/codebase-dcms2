id: tell_us_about_you
title: 'Tell Us About You'
description: ''
categories: {  }
elements: |-
  section_personal:
    '#type': webform_section
    '#title': 'Tell us about you'
    gender:
      '#type': radios
      '#title': 'I am'
      '#options':
        male: Male
        female: Female
        others: Others
      '#options_display': side_by_side
      '#required': true
    name:
      '#type': textfield
      '#title': Name
      '#placeholder': 'John Doe'
      '#required': true
    contact_row:
      '#type': webform_flexbox
      email:
        '#type': email
        '#title': Email
        '#placeholder': 'e.g. johndoe@gmail.com'
        '#required': true
      phone:
        '#type': tel
        '#title': 'Phone Number'
        '#placeholder': 'e.g. 012 345 6789'
        '#required': true
  section_health:
    '#type': webform_section
    '#title': 'Tell us about your health'
    activeness:
      '#type': textfield
      '#title': 'Describe Your Activeness'
      '#required': true
      '#rows': 3
    health_row:
      '#type': webform_flexbox
      birth_date:
        '#type': date
        '#title': 'Birth Date'
        '#placeholder': 'eg. 10/12/1995'
        '#required': true
      current_provider:
        '#type': textfield
        '#title': 'Current provider'
        '#placeholder': 'e.g. Global Health'
        '#required': true
    flexbox:
      '#type': webform_flexbox
      are_you_a_smoker:
        '#type': radios
        '#title': 'Are you a smoker?'
        '#options':
          'Yes': 'Yes'
          'No': 'No'
        '#required': true
      health_condition:
        '#type': radios
        '#title': 'Do you have underlying health conditions?'
        '#options':
          'Yes': 'Yes'
          'No': 'No'
        '#required': true
  terms:
    '#type': checkbox
    '#title': 'Yes I have read the terms and agree'
    '#required': true
  marketing_consent:
    '#type': checkbox
    '#title': 'I consent to receive marketing emails from Goodwell'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Get a Quote'
