      uuid: 1f4edc34-6907-4ed3-af1e-ba5057716615
      component_id: sdc.everbright_theme.card-testimonial
      inputs:
        text: 'Working with Everbright felt less like hiring an agency and more like adding a senior team to our org chart. They challenged our assumptions in the best way, brought clarity to a really complex product positioning problem, and shipped a website that has become our highest-converting marketing channel.'
        cite_name: 'Geraldine Bradtke'
        cite_text: 'Chief Marketing Officer'
        align: left
        style: default
    -
      parent_uuid: 1d2b0801-73ee-4e2a-8272-ad5654b799ae
