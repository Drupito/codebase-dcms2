      component_id: sdc.everbright_theme.card-testimonial
      inputs:
        text: "Everbright didn't just redesign our brand — they helped us understand who we are as a company. Their team took the time to dig into our values, our customers, and our goals, and what came out the other side was a brand identity that genuinely feels like us."
        cite_name: 'James Stroman'
        cite_text: 'Head of Branding'
        align: left
        style: default
    -
