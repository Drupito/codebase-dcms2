      uuid: fb5e6a93-0b67-44b2-9840-8a5db935107d
      component_id: sdc.everbright_theme.card-testimonial
      inputs:
        text: "We came to Everbright with a vague sense that our digital experience wasn't keeping up with our business, and they helped us turn that instinct into a clear roadmap. The new platform launched on time, on budget, and has already paid for itself in operational savings alone."
        cite_name: 'Bridhet Hyatt'
        cite_text: 'Co-founder & CEO'
        align: left
        style: default
