name: 'Everbright'
type: Site
description: 'Designed for a portfolio site, this template features a sharp and striking black-and-white design, along with articles and a project portfolio.'
recipes:
  - drupal_cms_site_template_base
  - drupal_cms_forms
install:
  - gin_login
  - node
  - system
  - ui_icons_field
  - ui_icons_menu
  - ui_icons_picker
  - ui_icons
  - everbright_theme
  - workflows
config:
  strict: false
  actions:
    field.field.node.page.field_description:
      setRequired: false
    gin_login.settings:
      simpleConfigUpdate:
        brand_image:
          use_default: false
          path: 'public://george-pagan-iii-FBwW4Xu3FTs-unsplash.jpg'
    node.type.page:
      setPreviewMode: 0
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'https://git.drupalcode.org/api/v4/projects/212223/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 86400
          # This is redundant, but it's necessary so that the Recommended list is first.
          drupalorg_jsonapi: {}
        default_source: recommended
    system.site:
      simpleConfigUpdate:
        page:
          403: /user/login
          404: /page/2
          front: /home
    system.theme:
      simpleConfigUpdate:
        admin: gin
        default: everbright_theme
    user.role.content_editor:
      grantPermissions:
        - create article content
        - create project content
        - delete any article content
        - delete any project content
        - edit any article content
        - edit any project content
    workflows.workflow.basic_editorial:
      addNodeTypes:
        - article
        - project

    canvas.component.theme_page_template.everbright_theme:
      createIfNotExists:
        label: 'Everbright theme page template'
        provider: canvas_page_template_component
        source: theme_page_template
        source_local_id: everbright_theme
        active_version: 15fe1e06320b1035
        versioned_properties:
          active:
            settings: { }
            fallback_metadata:
              slot_definitions:
                content:
                  title: Content
                  description: 'The Content region.'
                  examples:
                    - ''
                header:
                  title: Header
                  description: 'The Header region.'
                  examples:
                    - ''
                footer:
                  title: Footer
                  description: 'The Footer region.'
                  examples:
                    - ''

