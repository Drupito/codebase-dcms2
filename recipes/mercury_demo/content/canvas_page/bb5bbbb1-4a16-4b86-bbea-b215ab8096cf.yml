      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>Mercury is meant to be used as a starter kit, and does not provide backward compatibility. This allows us to rapidly innovate, iterate, and improve. If you create a sub-theme of Mercury, it is likely to break in the future.</p><p>For more technical information about how to build a custom theme based on Mercury, see the <a href="https://git.drupalcode.org/project/mercury/-/tree/1.x#customizing">project README</a>.</p>'
