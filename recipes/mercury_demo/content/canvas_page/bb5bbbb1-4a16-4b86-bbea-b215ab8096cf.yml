      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p><strong>Don''t subtheme Mercury!</strong> It does not provide backwards compatibility. This allows us to rapidly innovate, iterate, and improve it. If you create a sub-theme of Mercury, it is likely to break in the future.</p><p>See <a href="https://git.drupalcode.org/project/mercury/-/blob/1.x/CUSTOMIZING.md?ref_type=heads">CUSTOMIZING.md</a> for more information.</p>'
