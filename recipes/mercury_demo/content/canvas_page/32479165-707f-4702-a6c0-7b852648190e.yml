      uuid: 2f3a7243-9576-4b33-bbdc-9cc12ef6d518
      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>The navbar component provides a layout for the header with three slots for content:</p><ul><li data-list-item-id="e3daa2980800a4223e546c79e05bb3d1d">Site logo</li><li data-list-item-id="ee17ddd34ddcc8d58a21233746236af39">Navigation menu</li><li data-list-item-id="e53c5bfacaeee00faa44a29e8db641e01">CTAs</li></ul><p>CTAs are for optional buttons to place in the header. There is an option for menu alignment, either left, right or center.</p>'
          format: canvas_html_block
