      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>The group component provides a way to group components together to create more complex layouts. The group has many options that make it flexible for controlling the layout of multiple components.</p><p>Some examples of uses for a group:</p><ul><li data-list-item-id="eab73379c988242dd6b43d9ac4f3e2d3e">Bundling components with a grid or section into a single column</li><li data-list-item-id="eea22fee603fcaf9d0e2769228df74fba">Placing multiple elements inline</li><li data-list-item-id="e2f05e78fffa68094ef46e68b08e08790">Offsetting elements with a different colored background</li><li data-list-item-id="e2bb8fd3e21e178c680d2644a05d987c9">Additional control of spacing between elements in any slot</li><li data-list-item-id="e6fb7bef7e360940d144d5de59d9b60a4">Adding padding around a single element</li></ul>'
          format: canvas_html_block
        text_size: normal
        text_color: default
