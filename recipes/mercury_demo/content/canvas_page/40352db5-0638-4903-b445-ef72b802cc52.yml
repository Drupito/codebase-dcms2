      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>The hero billboard component is a full width banner with an image background and a slot for content. It includes options for height, content placement, opacity, and image background position. The image can be uploaded or selected from the media library.</p><p>It also has a toggle to overlap the header, which places it behind the menu if it is the first item on the page. To adjust this for changes to the menu height, you can modify the <em>--navbar-height</em> variable in theme.css.<em>&nbsp;</em></p>'
