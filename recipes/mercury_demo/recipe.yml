name: 'Mercury Demo'
type: Site
description: "Built with the Mercury theme, this template showcases Mercury and documents the theme's features and components."
recipes:
  - drupal_cms_site_template_base
install:
  - mercury
config:
  strict: false
  actions:
    node.type.page:
      setPreviewMode: 0
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'https://git.drupalcode.org/api/v4/projects/167158/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 86400
          # This is redundant, but it's necessary so that the Recommended list is first.
          drupalorg_jsonapi: {}
        default_source: recommended
    system.site:
      simpleConfigUpdate:
        page:
          404: /404
          front: /home
    system.theme:
      simpleConfigUpdate:
        default: mercury

    canvas.content_template.node.page.full:
      create:
        content_entity_type_id: node
        content_entity_type_bundle: page
        content_entity_type_view_mode: full
        component_tree: []
      setComponentTree:
        '0:92e68054-9f78-4420-8752-96ec693d2fa9':
          uuid: 92e68054-9f78-4420-8752-96ec693d2fa9
          component_id: block.system_breadcrumb_block
          inputs:
            label: Breadcrumbs
            label_display: '0'
        '1:b436211b-95ef-40ea-987a-e7b0f5782e33':
          uuid: b436211b-95ef-40ea-987a-e7b0f5782e33
          component_id: sdc.mercury.section
          component_version: 5ef4c2af9bd07348
          inputs:
            columns: '100'
            mobile_columns: '1'
            width: 75%
            margin_block_start: '48'
            margin_block_end: '48'
            padding_block_start: '0'
            padding_block_end: '0'
            section_header: true
            section_footer: true
        '1:header_slot:0:f08be9dc-e328-4cb7-9499-df6db9bd8900':
          parent_uuid: b436211b-95ef-40ea-987a-e7b0f5782e33
          slot: header_slot
          uuid: f08be9dc-e328-4cb7-9499-df6db9bd8900
          component_id: sdc.mercury.heading
          component_version: bba852857675de5f
          inputs:
            heading_text:
              sourceType: entity-field
              expression: 'ℹ︎␜entity:node:page␝title␞␟value'
            level: 1
            text_size: default
            text_color: default
            align: left
            url: ''
        '1:main_slot:0:caa1e4b2-d58b-4140-b99b-ab3e1ce55ad5':
          parent_uuid: b436211b-95ef-40ea-987a-e7b0f5782e33
          slot: main_slot
          uuid: caa1e4b2-d58b-4140-b99b-ab3e1ce55ad5
          component_id: sdc.mercury.text
          component_version: 16c79c28a4108f9b
          inputs:
            text:
              sourceType: entity-field
              expression: 'ℹ︎␜entity:node:page␝field_content␞␟processed'
            text_size: normal
            text_color: default

    canvas.component.theme_page_template.mercury:
      createIfNotExists:
        label: 'Mercury theme page template'
        provider: canvas_page_template_component
        source: theme_page_template
        source_local_id: mercury
        active_version: 15fe1e06320b1035
        versioned_properties:
          active:
            settings: { }
            fallback_metadata:
              slot_definitions:
                content:
                  title: Content
                  description: 'The Content region.'
                  examples:
                    - ''
                header:
                  title: Header
                  description: 'The Header region.'
                  examples:
                    - ''
                footer:
                  title: Footer
                  description: 'The Footer region.'
                  examples:
                    - ''

    canvas.page_variant.theme_mercury:
      create:
        label: 'Mercury theme'
        component_tree:
          - uuid: c7c0e636-1a3d-44d1-955a-602ca073e0a0
            component_id: theme_page_template.mercury
            component_version: 15fe1e06320b1035
            inputs: { }
          - parent_uuid: c7c0e636-1a3d-44d1-955a-602ca073e0a0
            slot: content
            uuid: 8e678b63-bb38-47ef-97ef-adc73fd2c3c5
            component_id: marker.page_content
            component_version: 3b12c0b99a6caecc
            inputs: { }
          - parent_uuid: c7c0e636-1a3d-44d1-955a-602ca073e0a0
            slot: footer
            uuid: bd25d2aa-d623-479e-86c7-89ecffdd3dfa
            component_id: sdc.mercury.footer
            component_version: d696cea1796b650e
            inputs:
              align: true
          - parent_uuid: bd25d2aa-d623-479e-86c7-89ecffdd3dfa
            slot: footer_first
            uuid: 07764b2c-2abb-4979-91d0-ce187e7ad767
            component_id: block.system_branding_block
            component_version: 7d528e00f56b3abf
            inputs:
              label: 'Site branding'
              label_display: '0'
              use_site_logo: true
              use_site_name: false
              use_site_slogan: false
          - parent_uuid: bd25d2aa-d623-479e-86c7-89ecffdd3dfa
            slot: footer_utility_first
            uuid: c792f1a5-fd27-40de-8d91-12b2ced91e61
            component_id: block.system_menu_block.footer
            component_version: 075503dbc228a45c
            inputs:
              label: Footer
              label_display: '0'
              level: 1
              depth: null
              expand_all_items: false
          - parent_uuid: bd25d2aa-d623-479e-86c7-89ecffdd3dfa
            slot: footer_utility_last
            uuid: 654cabce-0d4b-4f46-b380-cf7e2d989771
            component_id: sdc.mercury.text
            component_version: 16c79c28a4108f9b
            inputs:
              text:
                value: '<p><strong>©</strong> 2026 Drupal CMS</p>'
                format: canvas_html_block
              text_size: text-xs
              text_color: default
          - parent_uuid: c7c0e636-1a3d-44d1-955a-602ca073e0a0
            slot: header
            uuid: 3b448d2f-f191-44cb-8189-2362dbf3fe18
            component_id: sdc.mercury.navbar
            component_version: 3149f199d66bbc29
            inputs:
              menu_align: center
          - parent_uuid: 3b448d2f-f191-44cb-8189-2362dbf3fe18
            slot: links
            uuid: 852eede6-e6bc-4126-b1aa-fc611ca03b8d
            component_id: sdc.mercury.button
            component_version: 0ca665b3987e81dd
            inputs:
              variant: primary
              label: 'Get started'
              size: small
              icon: arrow-right
              mobile_width: false
              icon_first: false
              disabled: false
          - parent_uuid: 3b448d2f-f191-44cb-8189-2362dbf3fe18
            slot: logo
            uuid: 032b3150-7557-468a-ba40-d1c8fdc27f11
            component_id: block.system_branding_block
            component_version: 7d528e00f56b3abf
            inputs:
              label: 'Site branding'
              label_display: '0'
              use_site_logo: true
              use_site_name: false
              use_site_slogan: false
          - parent_uuid: 3b448d2f-f191-44cb-8189-2362dbf3fe18
            slot: navigation
            uuid: 6d13ceff-24ca-47d3-9a3b-10bc48480618
            component_id: block.system_menu_block.main
            component_version: 322535c0078cf59c
            inputs:
              label: 'Main navigation'
              label_display: '0'
              level: 1
              depth: null
              expand_all_items: false

    canvas.settings:
      simpleConfigUpdate:
        default_page_variant: theme_mercury

extra:
  drupal_cms_installer:
    creator: Drupal CMS
    links:
      - text: Learn more
        url: 'https://new.drupal.org/site-template/mercury-demo'
      - text: Demo
        url: 'https://simplytest.me/template/mercury_demo'
