            target_type: media
        heading:
          value: '<p>Round-the-Clock Coverage. Zero Gaps</p>'
          format: canvas_html_block
        stat_label: '24/7/365 Coverage'
        description:
          value: '<p>Our managed services team operates across time zones, ensuring your infrastructure is monitored and maintained at all hours, not just during business days. When something needs attention at 2am, we are already on it.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: 0b72041d-35c3-44e2-8fa6-be9544f52dbf
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: 23a39244-9d5f-40a7-bd1d-d85a2e452cd9
            target_type: media
        heading:
          value: '<p>Faster Resolution. Less Disruption</p>'
          format: canvas_html_block
        stat_label: '<2hr Average Incident Response'
        description:
          value: '<p>When issues arise, speed matters. Our escalation workflows are designed to move from detection to resolution in the shortest possible time, minimising the impact on your operations and the frustration for your teams.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
