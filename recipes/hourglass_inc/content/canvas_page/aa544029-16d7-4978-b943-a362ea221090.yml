            target_type: media
        heading:
          value: '<p>One Partner. Full Accountability</p>'
          format: canvas_html_block
        stat_label: 'Single Point of Accountability'
        description:
          value: '<p>Working with multiple vendors for different parts of your infrastructure creates gaps in accountability. With Hourglass Managed Services, there is a single point of contact responsible for everything, and they are always reachable.</p>'
          format: canvas_html_block
    -
