            target_type: media
        heading:
          value: '<p>Built for Stability. Designed for Growth.</p>'
          format: canvas_html_block
        stat_label: '99.99% Core Uptime'
        description:
          value: "<p>Nexus combines enterprise-grade reliability with the flexibility modern organizations need to scale. Whether you're expanding across teams, regions, or business functions, the platform maintains consistent performance without compromising speed, security, or user experience.</p>"
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: 0b72041d-35c3-44e2-8fa6-be9544f52dbf
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: 23a39244-9d5f-40a7-bd1d-d85a2e452cd9
            target_type: media
        heading:
          value: '<p>Zero-Downtime Deployments</p>'
          format: canvas_html_block
        stat_label: '0 Hours Planned Downtime'
        description:
          value: '<p>Platform updates should never disrupt productivity. Nexus leverages a blue-green deployment architecture to deliver seamless releases, ensuring every upgrade happens without service interruptions, maintenance windows, or operational delays.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: a988e778-a7d1-48d2-a021-ba22dc4fba4f
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: 7e983a5d-42b2-44ce-8928-b81fa0b4c4cb
            target_type: media
        heading:
          value: '<p>Real-Time Global Synchronization</p>'
          format: canvas_html_block
        stat_label: '<50ms Global Latency'
        description:
          value: '<p>From Frankfurt to New York to Singapore, Nexus keeps your entire operation connected in real time. Changes made in one region are reflected globally within milliseconds, enabling teams to collaborate, respond, and make decisions with complete confidence.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
