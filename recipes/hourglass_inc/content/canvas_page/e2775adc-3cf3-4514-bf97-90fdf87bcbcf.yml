      uuid: 34e844cb-faad-43ed-9380-781cffdf4d1b
      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: 'Data Retention'
        description:
          value: '<p>We retain personal data only for as long as necessary to fulfill the purposes for which it was collected, or as required by applicable law. When data is no longer needed, it is securely deleted or anonymized in accordance with our data retention schedule.</p>'
          format: canvas_html_block
        heading_tag: h4
    -
