      slot: content
      uuid: c8679cc2-0cc9-4d8c-b165-fa59b891314f
      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: 'Who Does This Policy Apply To?'
        description:
          value: '<p>This Privacy Policy applies to all visitors, users, and clients who interact with the Hourglass website, platform, or any of our associated services. By accessing our site or using our products, you agree to the collection and use of information in accordance with this policy.</p>'
          format: canvas_html_block
        heading_tag: h4
    -
      uuid: 3f746a29-5b0e-450b-83ef-89932bc32e11
      component_id: sdc.hourglass.layout
      inputs:
        hidden: false
        container: full
        rounded_top: false
        padding_bottom: '40'
    -
      parent_uuid: 3f746a29-5b0e-450b-83ef-89932bc32e11
      slot: content
      uuid: d97d508f-503b-43ec-98f6-6e6f772382aa
      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: 'Our Commitment to Data Protection'
        description:
          value: "<p>We understand that navigating data privacy regulations can be complex, from GDPR and CCPA to PIPEDA and Australia's Privacy Act. At Hourglass, compliance is not a checkbox, it is embedded into how we design and operate our platform. We ensure that every data process we run meets or exceeds the requirements of applicable global privacy laws.</p>"
          format: canvas_html_block
        heading_tag: h4
    -
      uuid: 0fbbe18b-7f42-4063-999f-58601f0211f1
      component_id: sdc.hourglass.layout
      inputs:
        hidden: false
        container: full
        rounded_top: false
        padding_bottom: '40'
    -
      parent_uuid: 0fbbe18b-7f42-4063-999f-58601f0211f1
      slot: content
      uuid: f97b74d0-a419-491d-af56-5e277ef92f1d
      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: ''
        description:
          value: '<p>We are committed to helping our clients, partners, and users protect their data. Our infrastructure is built to global compliance standards, and we provide clear documentation to support your own regulatory obligations wherever you operate.</p>'
          format: canvas_html_block
        heading_tag: h2
    -
      uuid: e8fbd4db-d53e-4113-93f3-a3af6b28d2c3
      component_id: sdc.hourglass.layout
      inputs:
        hidden: false
        container: full
