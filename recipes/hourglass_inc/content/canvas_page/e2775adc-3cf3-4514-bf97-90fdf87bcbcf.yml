      inputs:
        heading: Cookies
        description:
          value: '<p>We use cookies to improve your browsing experience, analyze site traffic, and deliver relevant content. You can manage your cookie preferences at any time through our cookie consent banner or your browser settings. For more information, please refer to our Cookie Policy."</p>'
          format: canvas_html_block
        heading_tag: h4
