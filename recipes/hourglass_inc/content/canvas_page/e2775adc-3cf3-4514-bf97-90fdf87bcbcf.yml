      slot: content
      uuid: 09c441ba-8ecb-4e74-aba8-4cade57f0856
      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: 'How We Use Your Data'
        description:
          value: '<p>We use the data we collect to provide and improve our products and services, respond to enquiries and support requests, send relevant communications about products, updates, or events (with your consent), ensure the security and integrity of our platform, and comply with our legal obligations.</p>'
          format: canvas_html_block
        heading_tag: h4
    -
      uuid: df3dc8aa-de8e-4260-b76d-a07e2e2ea1c9
      component_id: sdc.hourglass.layout
      inputs:
        hidden: false
