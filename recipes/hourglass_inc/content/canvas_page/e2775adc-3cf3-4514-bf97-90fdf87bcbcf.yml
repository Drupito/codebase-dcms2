      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: ''
        description:
          value: '<p>At Hourglass, we drive innovation in single-cell technologies and enterprise-grade software solutions. This website is operated by Hourglass GmbH, registered at the Local Court of Munich, Germany, under registration number HRB 150797. We believe transparency is the foundation of every successful B2B partnership.</p>'
          format: canvas_html_block
        heading_tag: h2
    -
