      uuid: 9ed3cb52-b5ac-4767-819a-72b7384a992a
      component_id: sdc.hourglass.heading-with-description
      inputs:
        heading: 'What Data We Collect'
        description:
          value: '<p>We may collect the following categories of data when you interact with our website or platform: contact information (name, email, phone number, job title), organizational information (company name, industry, size), usage data (pages visited, session duration, feature interactions), and technical data (IP address, browser type, device information). We do not sell your personal data to third parties under any circumstances.</p>'
          format: canvas_html_block
        heading_tag: h4
    -
      uuid: 832ec7aa-da02-42a1-b3bb-6ac837a52c84
      component_id: sdc.hourglass.layout
      inputs:
        hidden: false
        container: full
