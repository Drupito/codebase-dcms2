      uuid: 615f3f55-00de-4feb-a0c9-f0a7765f94f0
      component_id: sdc.hourglass.our-story
      inputs:
        body_primary:
          value: '<p>Hourglass was founded in 2016 by a group of systems engineers and enterprise architects who were tired of bloated, fragmented enterprise software. What started as a single automation tool built in a home office has grown into a trusted global technology partner serving organizations across four continents.</p>'
          format: canvas_html_block
        section_title:
          value: 'Our Story'
          format: canvas_html_block
        body_highlight:
          value: '<p>We chose "Hourglass" because time is the only resource you can''t buy. Our job is to help you use it more effectively.</p>'
          format: canvas_html_block
