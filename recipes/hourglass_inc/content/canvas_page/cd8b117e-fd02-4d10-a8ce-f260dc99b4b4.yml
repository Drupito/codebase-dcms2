      slot: items
      uuid: 9df8446a-3f5c-4547-bfca-0081634fd12c
      component_id: sdc.hourglass.faq-item
      inputs:
        answer:
          value: '<p>Requirements change; that is a reality of enterprise development. Our delivery methodology includes a structured change control process that allows requirements to evolve while maintaining visibility of the impact on scope, timeline, and budget. We never make changes silently or absorb scope increases without agreement.</p>'
          format: canvas_html_block
        question: 'How do you handle changing requirements during the project?'
    -
      parent_uuid: cd4d9410-4f7c-4536-95f9-743f3e4f7a98
      slot: items
      uuid: 5e712994-23f4-4e3c-b99f-6dbcf391a6d2
      component_id: sdc.hourglass.faq-item
      inputs:
        answer:
          value: "<p>We are technology-agnostic and select the stack best suited to each engagement, based on your performance requirements, your team's ability to maintain the system post-handover, your existing infrastructure, and the long-term sustainability of the chosen technologies. We will always explain and justify our recommendations.</p>"
          format: canvas_html_block
        question: 'What technology stack do you use?'
    -
      parent_uuid: 5e712994-23f4-4e3c-b99f-6dbcf391a6d2
