      component_id: sdc.hourglass.faq-item
      inputs:
        answer:
          value: '<p>Every Hourglass bespoke platform engagement includes a defined warranty period, typically 90 days post-launch, during which we resolve any defects or performance issues at no additional cost. Beyond the warranty period, we offer multiple support and maintenance options to ensure the platform continues to perform as expected.</p>'
          format: canvas_html_block
        question: "What happens if the platform doesn't perform as expected after go-live?"
