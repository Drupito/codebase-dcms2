      slot: content
      uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      component_id: sdc.hourglass.key-features
      inputs:
        section_title:
          value: 'Custom-Built. Enterprise-Grade.'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: 1dffefe8-c557-448f-abe2-ddcebf543336
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: fd796e10-e77a-48dd-89af-8ad046ffc139
            target_type: media
        heading:
          value: '<p>Built Around Your Operations, Not Ours</p>'
          format: canvas_html_block
        stat_label: '100% Requirement Design'
        description:
          value: '<p>A bespoke platform should reflect the way your organisation actually works, not force your teams to adapt to how a piece of software was designed. We start every engagement by understanding your operations in depth, and the platform we build is a direct expression of that understanding.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: 0b72041d-35c3-44e2-8fa6-be9544f52dbf
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: 23a39244-9d5f-40a7-bd1d-d85a2e452cd9
            target_type: media
        heading:
          value: '<p>No Vendor Lock-In, Ever</p>'
          format: canvas_html_block
        stat_label: 'Full IP Ownership on Completion'
        description:
          value: '<p>When we build a platform for you, you own it completely. The source code, the architecture, the documentation, all of it transfers to you at the end of the project. You are never dependent on Hourglass to run, modify, or extend what we built.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: a988e778-a7d1-48d2-a021-ba22dc4fba4f
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: 7e983a5d-42b2-44ce-8928-b81fa0b4c4cb
            target_type: media
        heading:
          value: '<p>Designed to Last. Built to Evolve</p>'
          format: canvas_html_block
        stat_label: 'Modular Architecture by Default'
        description:
          value: '<p>Enterprise platforms need to grow with the organisation. We architect for extensibility from the start, building modular, well-documented systems that your internal team or any future development partner can understand, maintain, and extend without starting from scratch.</p>'
          format: canvas_html_block
    -
      parent_uuid: a9182bbf-fcff-4dcb-91cf-2e2d9953f055
      slot: slides
      uuid: 8c30cf8d-fcf6-461d-9491-a27000fb5440
      component_id: sdc.hourglass.key-feature-slide
      inputs:
        media:
          CANVAS_ENTITY_REFERENCE:
            target_uuid: 7e983a5d-42b2-44ce-8928-b81fa0b4c4cb
            target_type: media
        heading:
          value: '<p>Security That Goes Beyond the Checklist</p>'
          format: canvas_html_block
        stat_label: 'Independent Security Testing on Every Release'
        description:
          value: '<p>Enterprise platforms handle sensitive data and critical processes. Security is not an afterthought in our development process; it is a design constraint from the first architecture session. Every platform we build undergoes independent penetration testing before it goes anywhere near a production environment.</p>'
          format: canvas_html_block
