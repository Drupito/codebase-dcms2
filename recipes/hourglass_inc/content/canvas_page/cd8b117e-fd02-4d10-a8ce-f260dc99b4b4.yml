        heading: 'Frequently Asked Questions'
    -
      parent_uuid: cd4d9410-4f7c-4536-95f9-743f3e4f7a98
      slot: items
      uuid: 4610e8b8-f2eb-475a-bb88-2a38893c73d3
      component_id: sdc.hourglass.faq-item
      inputs:
        answer:
          value: "<p>A bespoke platform is designed and built specifically for your organisation. It reflects your exact workflows, your specific integration requirements, and your unique operational logic. A configured off-the-shelf product, however customised, is still built around someone else's assumptions about how your business should work. When those assumptions don't fit, you end up working around the software rather than with it.</p>"
          format: canvas_html_block
        question: 'What makes a bespoke platform different from a configured off-the-shelf product?'
    -
      parent_uuid: 4610e8b8-f2eb-475a-bb88-2a38893c73d3
