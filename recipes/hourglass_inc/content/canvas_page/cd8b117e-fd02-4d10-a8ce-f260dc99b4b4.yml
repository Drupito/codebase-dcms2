      uuid: 8688b4af-6904-45ca-9f55-c845dfc509e4
      component_id: sdc.hourglass.faq-item
      inputs:
        answer:
          value: "<p>Yes. We offer structured post-go-live support as a time-limited hypercare period, a longer-term managed services arrangement, or a retainer-based model for ongoing development and optimisation. The right option depends on your team's internal capabilities and how actively the platform will evolve after launch.</p>"
          format: canvas_html_block
        question: 'Do you provide support after the platform goes live?'
    -
