      slot: items
      uuid: 7b256450-8bd2-41cb-8139-7bc855768f8f
      component_id: sdc.hourglass.faq-item
      inputs:
        answer:
          value: '<p>Timelines vary significantly depending on complexity, scope, and the number of integrations required. A focused bespoke tool can be delivered in 3 to 4 months. A complex enterprise platform with multiple integration points and high compliance requirements typically takes 9 to 18 months. We provide a detailed timeline estimate at the end of the discovery phase.</p>'
          format: canvas_html_block
        question: 'How long does it take to build a bespoke platform?'
    -
      parent_uuid: 7b256450-8bd2-41cb-8139-7bc855768f8f
