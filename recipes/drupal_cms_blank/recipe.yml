name: Blank
description: 'A blank template with the foundational features of Drupal CMS, for those who truly want to start from scratch.'
type: Site
recipes:
  - drupal_cms_site_template_base

install:
  # A blank theme, generated by drupal/site_template_helper (see composer.json).
  - blank

config:
  actions:
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources.recommended:
          # Included with this site template's shipped files.
          # @see content/file/1cc8aa0c-5144-4046-a38d-d3c23296ec08.yml
          uri: 'public://recommended-add-ons.yaml'
          # Cache for a day.
          ttl: 86400
        default_source: recommended
    # For theme development, disable CSS and JS aggregation.
    system.performance:
      simpleConfigUpdate:
        css.preprocess: false
        js.preprocess: false
    # Set the home page to a blank Canvas landing page.
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    # By default, use the blank theme generated by the site template helper plugin.
    # @see `composer.json`
    system.theme:
      simpleConfigUpdate:
        default: 'blank'
      # This action is provided by Drupal CMS Helper. Since this site template uses an empty theme,
      # you'll very likely want Drupal's theme development mode enabled by default.
      themeDevelopmentMode: true
