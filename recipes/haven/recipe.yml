name: Haven
description: 'Designed for non-profit sites, this template features a bright, warm design that can be adapted for many use cases. It comes pre-configured with blog, projects and people profiles, as well as newsletter signup, donation add-ons and more.'
type: Site
recipes:
  - drupal_cms_site_template_base
  - drupal_cms_search
  - drupal_cms_forms
install:
  - claro
  - cva
  - haven_theme
  - project_browser
  - ui_icons_field
  - ui_icons_menu
  - views_infinite_scroll
  - workflows
config:
  strict: false
  actions:
    # @todo Remove this when drupal_cms_site_template_base 2.2.3 is released.
    field.field.media.image.field_media_image:
      setSettings:
        file_extensions: 'png gif jpg jpeg webp avif'
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'https://git.drupalcode.org/api/v4/projects/199685/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 86400
          # This is redundant, but it's necessary so that the Recommended list is first.
          drupalorg_jsonapi: {}
        default_source: recommended
    system.performance:
      simpleConfigUpdate:
        cache.page.max_age: 900
    system.site:
      simpleConfigUpdate:
        page.404: '/404'
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: haven_theme
    user.role.content_editor:
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete any %bundle content'
        - 'edit any %bundle content'
    workflows.workflow.basic_editorial:
      addNodeTypes: '*'
    canvas.content_template.node.blog.full:
