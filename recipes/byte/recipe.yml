name: Byte
type: Site
description: 'Designed for a SaaS product website, this template includes landing pages, a blog, newsletter sign up and other features.'
recipes:
  - drupal_cms_site_template_base
  - drupal_cms_forms
  - drupal_cms_search
install:
  - selective_better_exposed_filters
  - ui_icons_menu
  - views_infinite_scroll
  - byte_theme
config:
  strict: false
  actions:
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'https://git.drupalcode.org/api/v4/projects/194416/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 86400
          drupalorg_jsonapi: { }
        default_source: recommended
    system.performance:
      simpleConfigUpdate:
        cache.page.max_age: 900
    system.site:
      simpleConfigUpdate:
        page.404: '/404'
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: byte_theme
    user.role.content_editor:
      grantPermissions:
        - create blog content
        - delete any blog content
        - edit any blog content
    workflows.workflow.basic_editorial:
      addNodeTypes:
        - blog
    canvas.component.theme_page_template.byte_theme:
